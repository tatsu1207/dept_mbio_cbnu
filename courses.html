<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Dept. of Microbiology, CBNU</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-root="./">
<header id="main-nav" class="bg-white sticky top-0 z-20 border-b border-gray-200 shadow-sm"></header>
<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <h1 class="text-3xl sm:text-4xl section-title mb-6" data-ko="교과과정" data-en="Courses"></h1>
  <div class="flex gap-2 mb-6">
    <button type="button" data-level="undergraduate"
            class="px-4 py-2 rounded-md border border-gray-300 text-sm font-semibold"
            data-ko="학부" data-en="Undergraduate"></button>
    <button type="button" data-level="graduate"
            class="px-4 py-2 rounded-md border border-gray-300 text-sm font-semibold"
            data-ko="대학원" data-en="Graduate"></button>
  </div>
  <div id="course-list" class="grid gap-4 sm:grid-cols-2"></div>
</main>
<footer id="main-footer" class="mt-12"></footer>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/main.js"></script>
<script src="./assets/js/pages.js"></script>
</body>
</html>
