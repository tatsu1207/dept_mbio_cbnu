<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | Dept. of Microbiology, CBNU</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-root="./">
<header id="main-nav" class="bg-white sticky top-0 z-20 border-b border-gray-200 shadow-sm"></header>
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">
  <h1 class="text-3xl sm:text-4xl section-title" data-ko="학과 소개" data-en="About the Department"></h1>

  <section class="card p-8">
    <h2 class="text-xl font-bold dept-color mb-3" data-ko="학과장 인사말" data-en="Message from the Chair"></h2>
    <p class="text-gray-700 leading-relaxed"
       data-ko="충북대학교 미생물학과 홈페이지를 방문해 주셔서 감사합니다. 우리 학과는 미생물의 기초 생명현상 규명에서부터 환경·보건·산업 분야의 응용에 이르기까지 폭넓은 연구와 교육을 수행하고 있습니다."
       data-en="Welcome to the Department of Microbiology at Chungbuk National University. Our teaching and research span the fundamental biology of microorganisms through to applications in the environment, public health, and industry."></p>
    <p class="mt-4 text-sm text-gray-500" data-ko="※ 내용을 학과 실제 인사말로 교체하세요." data-en="※ Replace with the department's own text."></p>
  </section>

  <section class="grid gap-6 sm:grid-cols-3">
    <div class="card p-6 text-center"><p class="text-3xl font-extrabold dept-color">1978</p>
      <p class="text-sm text-gray-500 mt-1" data-ko="학과 설립" data-en="Founded"></p></div>
    <div class="card p-6 text-center"><p class="text-3xl font-extrabold dept-color">—</p>
      <p class="text-sm text-gray-500 mt-1" data-ko="전임 교수" data-en="Faculty members"></p></div>
    <div class="card p-6 text-center"><p class="text-3xl font-extrabold dept-color">—</p>
      <p class="text-sm text-gray-500 mt-1" data-ko="재학생" data-en="Students enrolled"></p></div>
  </section>

  <section class="card p-8">
    <h2 class="text-xl font-bold dept-color mb-4" data-ko="교육 목표" data-en="Educational Goals"></h2>
    <ul class="space-y-3 text-gray-700 list-disc list-inside">
      <li data-ko="미생물학의 기초 이론과 실험 기법에 대한 체계적 훈련" data-en="Systematic training in microbiological theory and laboratory technique"></li>
      <li data-ko="생물정보학 및 데이터 분석 역량을 갖춘 연구인력 양성" data-en="Researchers fluent in bioinformatics and data analysis"></li>
      <li data-ko="산업체 및 연구기관과 연계한 현장 중심 교육" data-en="Field-oriented education in partnership with industry and institutes"></li>
    </ul>
  </section>
</main>
<footer id="main-footer" class="mt-12"></footer>
