<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body data-root="./">
<header id="main-nav" class="bg-white sticky top-0 z-20 border-b border-gray-200 shadow-sm"></header>
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
  <h1 class="text-3xl sm:text-4xl section-title" data-ko="찾아오는 길" data-en="Contact & Directions"></h1>

  <div class="grid gap-6 md:grid-cols-2">
    <section class="card p-6">
      <h2 class="font-bold dept-color mb-3" data-ko="학과 사무실" data-en="Department Office"></h2>
      <p class="text-gray-700 leading-relaxed"
         data-ko="28644 충청북도 청주시 서원구 충대로 1<br>충북대학교 자연과학대학 미생물학과"
         data-en="Department of Microbiology<br>Chungbuk National University<br>Chungdae-ro 1, Seowon-gu, Cheongju,<br>Chungbuk 28644, Republic of Korea"></p>
      <p class="mt-4 text-sm text-gray-600">Tel. 043-261-2300</p>
      <p class="text-sm"><a href="mailto:microbio@chungbuk.ac.kr" class="accent-color hover:underline">microbio@chungbuk.ac.kr</a></p>
    </section>

    <section class="card p-6">
      <h2 class="font-bold dept-color mb-3" data-ko="세미나실" data-en="Seminar Room"></h2>
      <p class="text-gray-700 text-sm"
         data-ko="자연과학대학 S1-4 208호"
         data-en="Natural Sciences Bldg. S1-4, Room 208"></p>
      <a href="./reserve.html" class="inline-block mt-4 px-4 py-2 rounded-md dept-bg text-white text-sm font-semibold hover:opacity-90"
         data-ko="예약 페이지로 이동" data-en="Go to booking page"></a>
    </section>
  </div>

  <section class="card overflow-hidden">
    <iframe title="Campus map" class="w-full h-96 border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      src="https://www.openstreetmap.org/export/embed.html?bbox=127.44%2C36.62%2C127.47%2C36.64&amp;layer=mapnik&amp;marker=36.6288%2C127.4565"></iframe>
  </section>
</main>
<footer id="main-footer" class="mt-12"></footer>
